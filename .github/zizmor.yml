# zizmor audits these workflows for GitHub Actions vulnerabilities — template
# injection, credential persistence, cache poisoning and so on. CI runs it, so
# anything not listed here is a finding that has to be fixed rather than
# argued with.

rules:
  adhoc-packages:
    ignore:
      # One deliberate `npm install` in the release job: the freshly-built
      # .tgz, installed to smoke-test the exact artifact about to be
      # published. That is the point of the step, and no lockfile could
      # cover it.
      - release.yml
