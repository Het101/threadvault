version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait before proposing a brand-new version. Most malicious releases are
    # yanked within a couple of days of publication, and a week is long enough
    # that a compromised package is usually gone before it reaches a PR here.
    # Longer for majors, which need reading anyway.
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    ignore:
      # @types/node tracks the *minimum* supported runtime, not the latest
      # release. On 26 the compiler would happily accept an API that does not
      # exist on the Node 22.12 this package declares support for, and say
      # nothing. Bump this deliberately, together with engines.node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # The Azure SDK packages have to move together: a partial bump is how the
      # Node 20 compatibility mess started.
      azure:
        patterns: ["@azure/*", "@azure-rest/*"]
      dev:
        dependency-type: development
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
