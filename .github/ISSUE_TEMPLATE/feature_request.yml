name: Feature request
description: Something Threadvault should be able to do and cannot.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What can you not do today?
      description: The situation you are stuck in, not the feature you have in mind.
    validations: { required: true }
  - type: textarea
    id: workaround
    attributes:
      label: What are you doing instead?
      description: A manual script, a spreadsheet, giving up — all useful to know.
  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
  - type: checkboxes
    id: scope
    attributes:
      label: Does it fit?
      options:
        - label: This keeps ACS disposable and Postgres the source of truth, rather than the reverse
