name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only floor, so a job added to this file later starts with nothing.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Write, because this job drafts the GitHub release for the tag.
      contents: write
      # Required for npm provenance: npm uses this to attest that the package
      # was built from this repo, at this commit, by this workflow. The npm
      # page then shows where it came from, which matters more than usual for
      # a tool people point at production credentials.
      id-token: write
      # To open the issue that tells a human a release is waiting for them.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
          # Caching is off on purpose. The Actions cache is writable by
          # workflows with fewer permissions than this one, and this is the
          # job that publishes. Restoring their entries here would let a PR
          # run influence a signed release.

      # Node 22 ships npm 10, which has no OIDC support. Trusted publishing
      # needs npm 11.5.1 or newer, so without this the publish step falls back
      # to looking for a token that no longer exists.
      # Pinned, not `@latest`: this job holds the OIDC identity that can publish
      # to npm, so the package manager it runs is a supply-chain input like any
      # other. Bump deliberately; nothing automated watches this line.
      - name: npm new enough for trusted publishing
        run: |
          set -e
          npm install -g npm@12.1.0
          npm --version

      - run: npm ci

      # A tag that disagrees with package.json publishes the wrong version
      # under the right name, which cannot be undone.
      - name: tag must match package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json $pkg"
            exit 1
          fi
          echo "tag and package.json agree on $pkg"

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Prove the built artifact actually runs before it is published.
      - name: the bin must work from a clean install
        run: |
          set -e
          npm pack
          mkdir -p /tmp/verify && cd /tmp/verify
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/threadvault-*.tgz
          ./node_modules/.bin/threadvault --version
          ./node_modules/.bin/threadvault migrate verify --help > /dev/null
          echo "installed bin works"

      # Stage rather than publish. CI can prepare a release but cannot hand it
      # to the world: a human approves it afterwards with their own 2FA. So a
      # workflow that is ever compromised, or a malicious change merged into
      # this file, can stage something nobody asked for and it still reaches
      # no one. npm's trusted publisher is configured to refuse a direct
      # publish from here, which makes that guarantee enforced rather than
      # merely intended.
      #
      # No NODE_AUTH_TOKEN: the trusted publisher authenticates over OIDC, so
      # there is no secret to leak, rotate or expire. An empty NODE_AUTH_TOKEN
      # would actively break it — setup-node writes it into .npmrc and npm
      # would try that empty credential instead of falling back to OIDC.
      - name: stage the release on npm
        id: stage
        run: |
          set -o pipefail
          npm stage publish --provenance --access public 2>&1 | tee /tmp/stage.log
          # npm prints: "+ threadvault@0.2.2 (staged with id <uuid>)". Approving
          # needs that id, and hunting for it is the one manual step between a
          # green build and a published package — so carry it forward rather
          # than making a human go and look it up.
          id=$(grep -oE 'staged with id [0-9a-f-]{36}' /tmp/stage.log | head -1 | sed 's/.* //')
          if [ -z "$id" ]; then
            echo "::warning::could not read the stage id from npm's output; the issue will say how to look it up"
          fi
          echo "stage_id=$id" >> "$GITHUB_OUTPUT"

      # Drafted, not published — the same bargain as the npm stage above. CI
      # prepares both, a human publishes both. Otherwise a rejected npm stage
      # leaves a GitHub release announcing a version nobody can install.
      - name: draft the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ver="${GITHUB_REF_NAME#v}"
          # This version's section of CHANGELOG.md, which is where the notes are
          # already written. Read from the file rather than restating them here,
          # so the two cannot drift.
          awk -v hdr="## [$ver]" '
            index($0, hdr) == 1 { found = 1; next }
            found && /^## \[/   { exit }
            found               { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "::warning::no CHANGELOG section for $ver; using generated notes"
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md
          fi
          echo "drafted release $GITHUB_REF_NAME"

      # A step summary is only seen by someone already looking at the run, and
      # GitHub emails on failure, not on success — so a staged release that
      # nobody is told about is a release that sits there. An issue notifies
      # its assignee by email and on mobile, and stays visible until closed.
      - name: tell a human it is waiting
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          # Through env, never interpolated into the script body.
          STAGE_ID: ${{ steps.stage.outputs.stage_id }}
        run: |
          set -e
          # Fall back to the lookup command only if npm's output changed shape.
          sid="${STAGE_ID:-<stage-id>}"
          {
            echo "\`$GITHUB_REF_NAME\` passed every check. It is **staged on npm** and the"
            echo "GitHub release is **drafted**. Neither is public until you approve them."
            echo ""
            if [ -n "$STAGE_ID" ]; then
              echo "Stage id: \`$STAGE_ID\`"
            else
              echo "Stage id: run \`npm stage list threadvault\` — it could not be read from the build log."
            fi
            echo ""
            echo "## Approve"
            echo ""
            echo '```bash'
            echo "npm stage view $sid       # confirm it is the right build"
            echo "npm stage approve $sid    # your 2FA — a passkey opens a browser"
            echo "gh release edit $GITHUB_REF_NAME --draft=false --latest"
            echo '```'
            echo ""
            echo "On Windows PowerShell use \`npm.cmd\`, and run it in your own terminal so"
            echo "the passkey URL is clickable."
            echo ""
            echo "## Or discard"
            echo ""
            echo '```bash'
            echo "npm stage reject $sid"
            echo "gh release delete $GITHUB_REF_NAME"
            echo '```'
            echo ""
            echo "Close this issue once you have done one or the other."
            echo ""
            echo "[Workflow run](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } > /tmp/issue.md
          gh issue create \
            --title "Release $GITHUB_REF_NAME is staged and waiting for you" \
            --body-file /tmp/issue.md \
            --assignee "$OWNER" \
            --label release 2>/dev/null \
          || gh issue create \
            --title "Release $GITHUB_REF_NAME is staged and waiting for you" \
            --body-file /tmp/issue.md \
            --assignee "$OWNER"

      - name: how to release it
        env:
          STAGE_ID: ${{ steps.stage.outputs.stage_id }}
        run: |
          sid="${STAGE_ID:-<stage-id>}"
          {
            echo "### Staged, not yet released"
            echo ""
            echo "\`$GITHUB_REF_NAME\` passed every check. The npm package is staged"
            echo "and the GitHub release is drafted. Neither is public until you say so."
            echo ""
            echo '```bash'
            echo "npm stage view $sid       # confirm it is the right build"
            echo "npm stage approve $sid    # your 2FA"
            echo "gh release edit $GITHUB_REF_NAME --draft=false --latest"
            echo '```'
            echo ""
            echo "To discard instead: \`npm stage reject $sid\` and \`gh release delete $GITHUB_REF_NAME\`"
          } >> "$GITHUB_STEP_SUMMARY"
