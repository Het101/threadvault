name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm provenance: npm uses this to attest that the package was
  # built from this repo, at this commit, by this workflow. The npm page then
  # shows where it came from, which matters more than usual for a tool people
  # point at production credentials.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10, which has no OIDC support. Trusted publishing
      # needs npm 11.5.1 or newer, so without this the publish step falls back
      # to looking for a token that no longer exists.
      - name: npm new enough for trusted publishing
        run: |
          set -e
          npm install -g npm@latest
          npm --version

      - run: npm ci

      # A tag that disagrees with package.json publishes the wrong version
      # under the right name, which cannot be undone.
      - name: tag must match package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json $pkg"
            exit 1
          fi
          echo "tag and package.json agree on $pkg"

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Prove the built artifact actually runs before it is published.
      - name: the bin must work from a clean install
        run: |
          set -e
          npm pack
          mkdir -p /tmp/verify && cd /tmp/verify
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/threadvault-*.tgz
          ./node_modules/.bin/threadvault --version
          ./node_modules/.bin/threadvault migrate verify --help > /dev/null
          echo "installed bin works"

      # No NODE_AUTH_TOKEN. The trusted publisher configured on npm lets this
      # workflow authenticate over OIDC, so there is no token in a secret to
      # leak, rotate or expire. An empty NODE_AUTH_TOKEN would actually break
      # it: setup-node writes it into .npmrc, and npm would try that empty
      # credential instead of falling back to OIDC.
      - name: publish to npm
        run: npm publish --provenance --access public
