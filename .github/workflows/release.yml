name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  # Write, because this workflow drafts the GitHub release for the tag.
  contents: write
  # Required for npm provenance: npm uses this to attest that the package was
  # built from this repo, at this commit, by this workflow. The npm page then
  # shows where it came from, which matters more than usual for a tool people
  # point at production credentials.
  id-token: write
  # To open the issue that tells a human a release is waiting for them.
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10, which has no OIDC support. Trusted publishing
      # needs npm 11.5.1 or newer, so without this the publish step falls back
      # to looking for a token that no longer exists.
      - name: npm new enough for trusted publishing
        run: |
          set -e
          npm install -g npm@latest
          npm --version

      - run: npm ci

      # A tag that disagrees with package.json publishes the wrong version
      # under the right name, which cannot be undone.
      - name: tag must match package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json $pkg"
            exit 1
          fi
          echo "tag and package.json agree on $pkg"

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Prove the built artifact actually runs before it is published.
      - name: the bin must work from a clean install
        run: |
          set -e
          npm pack
          mkdir -p /tmp/verify && cd /tmp/verify
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/threadvault-*.tgz
          ./node_modules/.bin/threadvault --version
          ./node_modules/.bin/threadvault migrate verify --help > /dev/null
          echo "installed bin works"

      # Stage rather than publish. CI can prepare a release but cannot hand it
      # to the world: a human approves it afterwards with their own 2FA. So a
      # workflow that is ever compromised, or a malicious change merged into
      # this file, can stage something nobody asked for and it still reaches
      # no one. npm's trusted publisher is configured to refuse a direct
      # publish from here, which makes that guarantee enforced rather than
      # merely intended.
      #
      # No NODE_AUTH_TOKEN: the trusted publisher authenticates over OIDC, so
      # there is no secret to leak, rotate or expire. An empty NODE_AUTH_TOKEN
      # would actively break it — setup-node writes it into .npmrc and npm
      # would try that empty credential instead of falling back to OIDC.
      - name: stage the release on npm
        run: npm stage publish --provenance --access public

      # Drafted, not published — the same bargain as the npm stage above. CI
      # prepares both, a human publishes both. Otherwise a rejected npm stage
      # leaves a GitHub release announcing a version nobody can install.
      - name: draft the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ver="${GITHUB_REF_NAME#v}"
          # This version's section of CHANGELOG.md, which is where the notes are
          # already written. Read from the file rather than restating them here,
          # so the two cannot drift.
          awk -v hdr="## [$ver]" '
            index($0, hdr) == 1 { found = 1; next }
            found && /^## \[/   { exit }
            found               { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "::warning::no CHANGELOG section for $ver; using generated notes"
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md
          fi
          echo "drafted release $GITHUB_REF_NAME"

      # A step summary is only seen by someone already looking at the run, and
      # GitHub emails on failure, not on success — so a staged release that
      # nobody is told about is a release that sits there. An issue notifies
      # its assignee by email and on mobile, and stays visible until closed.
      - name: tell a human it is waiting
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -e
          {
            echo "\`$GITHUB_REF_NAME\` passed every check. It is **staged on npm** and the"
            echo "GitHub release is **drafted**. Neither is public until you approve them."
            echo ""
            echo "## Approve"
            echo ""
            echo '```bash'
            echo "npm stage list threadvault      # find the stage id"
            echo "npm stage view <stage-id>       # confirm it is the right build"
            echo "npm stage approve <stage-id>    # your 2FA — passkey opens a browser"
            echo "gh release edit $GITHUB_REF_NAME --draft=false --latest"
            echo '```'
            echo ""
            echo "## Or discard"
            echo ""
            echo '```bash'
            echo "npm stage reject <stage-id>"
            echo "gh release delete $GITHUB_REF_NAME"
            echo '```'
            echo ""
            echo "Close this issue once you have done one or the other."
            echo ""
            echo "[Workflow run](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } > /tmp/issue.md
          gh issue create \
            --title "Release $GITHUB_REF_NAME is staged and waiting for you" \
            --body-file /tmp/issue.md \
            --assignee "$OWNER" \
            --label release 2>/dev/null \
          || gh issue create \
            --title "Release $GITHUB_REF_NAME is staged and waiting for you" \
            --body-file /tmp/issue.md \
            --assignee "$OWNER"

      - name: how to release it
        run: |
          {
            echo "### Staged, not yet released"
            echo ""
            echo "\`$GITHUB_REF_NAME\` passed every check. The npm package is staged"
            echo "and the GitHub release is drafted. Neither is public until you say so."
            echo ""
            echo '```bash'
            echo "npm stage list threadvault"
            echo "npm stage view <stage-id>      # confirm it is the right build"
            echo "npm stage approve <stage-id>   # your 2FA"
            echo "gh release edit $GITHUB_REF_NAME --draft=false --latest"
            echo '```'
            echo ""
            echo "To discard instead: \`npm stage reject <stage-id>\` and \`gh release delete $GITHUB_REF_NAME\`"
          } >> "$GITHUB_STEP_SUMMARY"
