name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm provenance: npm uses this to attest that the package was
  # built from this repo, at this commit, by this workflow. The npm page then
  # shows where it came from, which matters more than usual for a tool people
  # point at production credentials.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10, which has no OIDC support. Trusted publishing
      # needs npm 11.5.1 or newer, so without this the publish step falls back
      # to looking for a token that no longer exists.
      - name: npm new enough for trusted publishing
        run: |
          set -e
          npm install -g npm@latest
          npm --version

      - run: npm ci

      # A tag that disagrees with package.json publishes the wrong version
      # under the right name, which cannot be undone.
      - name: tag must match package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json $pkg"
            exit 1
          fi
          echo "tag and package.json agree on $pkg"

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Prove the built artifact actually runs before it is published.
      - name: the bin must work from a clean install
        run: |
          set -e
          npm pack
          mkdir -p /tmp/verify && cd /tmp/verify
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/threadvault-*.tgz
          ./node_modules/.bin/threadvault --version
          ./node_modules/.bin/threadvault migrate verify --help > /dev/null
          echo "installed bin works"

      # Stage rather than publish. CI can prepare a release but cannot hand it
      # to the world: a human approves it afterwards with their own 2FA. So a
      # workflow that is ever compromised, or a malicious change merged into
      # this file, can stage something nobody asked for and it still reaches
      # no one. npm's trusted publisher is configured to refuse a direct
      # publish from here, which makes that guarantee enforced rather than
      # merely intended.
      #
      # No NODE_AUTH_TOKEN: the trusted publisher authenticates over OIDC, so
      # there is no secret to leak, rotate or expire. An empty NODE_AUTH_TOKEN
      # would actively break it — setup-node writes it into .npmrc and npm
      # would try that empty credential instead of falling back to OIDC.
      - name: stage the release on npm
        run: npm stage publish --provenance --access public

      - name: how to release it
        run: |
          {
            echo "### Staged, not yet released"
            echo ""
            echo "\`$GITHUB_REF_NAME\` passed every check and is staged on npm."
            echo "It is not installable until you approve it:"
            echo ""
            echo '```bash'
            echo "npm stage list threadvault"
            echo "npm stage view <stage-id>      # confirm it is the right build"
            echo "npm stage approve <stage-id>   # prompts for your 2FA code"
            echo '```'
            echo ""
            echo "To discard it instead: \`npm stage reject <stage-id>\`"
          } >> "$GITHUB_STEP_SUMMARY"
