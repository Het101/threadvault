name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. A job that needs more asks for it explicitly.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      # Actions are pinned to commit SHAs, not tags. A tag is mutable: whoever
      # controls the action's repo can repoint v7 at new code, and it runs here
      # with our token. The trailing comment is the human-readable version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: node -v && npm -v
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: node dist/cli.js --help
      # Every subcommand must at least be reachable in the built bundle. A
      # broken import only surfaces when the command is actually invoked.
      - name: smoke every command
        run: |
          set -e
          node dist/cli.js probe --help > /dev/null
          node dist/cli.js doctor --help > /dev/null
          node dist/cli.js mirror backfill --help > /dev/null
          node dist/cli.js migrate extract --help > /dev/null
          node dist/cli.js migrate plan --help > /dev/null
          node dist/cli.js migrate rehearse --help > /dev/null
          node dist/cli.js migrate apply --help > /dev/null
          node dist/cli.js migrate verify --help > /dev/null

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The pre-commit hook can be bypassed with --no-verify. This cannot.
      - name: scan the tree for committed secrets
        run: |
          set -e
          if git grep -nE 'accesskey=[A-Za-z0-9+/]{20,}={0,2}' -- . ':!package-lock.json'; then
            echo "::error::an ACS access key is present in the tree"
            exit 1
          fi
          if git grep -nE '(postgres|postgresql)://[^:/@[:space:]]+:[A-Za-z0-9!#%^&*_+=~.-]{10,}@' -- . ':!package-lock.json'; then
            echo "::error::a database URL with a live password is present in the tree"
            exit 1
          fi
          if git grep -nE 'npm_[A-Za-z0-9]{36}' -- . ':!package-lock.json'; then
            echo "::error::an npm token is present in the tree"
            exit 1
          fi
          if git grep -nE '_authToken[[:space:]]*=[[:space:]]*[^$][^[:space:]]{8,}' -- . ':!package-lock.json'; then
            echo "::error::an _authToken value is present in the tree"
            exit 1
          fi
          echo "no secrets found in the tree"

      - name: commit messages are conventional and unattributed
        # Through env, never interpolated into the script body. A ${{ }} inside
        # run is substituted before the shell sees it, so anything attacker-
        # controlled becomes shell code. It is a SHA here, but the habit is what
        # keeps the next one from being a branch name.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -e
          base="$BASE_SHA"
          if [ -z "$base" ]; then base="HEAD~1"; fi
          for sha in $(git log --format='%H' "$base..HEAD"); do
            git log -1 --format='%B' "$sha" > /tmp/msg
            .githooks/commit-msg /tmp/msg
          done
          echo "commit messages ok"

      - name: commits must be signed
        # main rejects unsigned commits, but the rejection arrives at merge time
        # with no explanation of the cause. The usual cause is a rebase that was
        # not told to sign — including GitHub's own "Update branch" button, which
        # rebases server-side and cannot sign as you.
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -e
          if [ -z "$PR" ]; then
            echo "not a pull request; nothing to check"
            exit 0
          fi
          unsigned=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" \
            --jq '.[] | select(.commit.verification.verified == false) | .sha[0:8] + "  " + (.commit.message | split("\n")[0])')
          if [ -n "$unsigned" ]; then
            echo "::error::unsigned commits in this pull request"
            echo "$unsigned"
            echo ""
            echo "Sign them with:"
            echo "  git rebase --exec 'git commit --amend --no-edit -S' origin/main"
            echo "  git push --force-with-lease"
            echo ""
            echo "Do not use GitHub's 'Update branch' button: it rebases on the"
            echo "server and strips signatures. Rebase locally instead."
            exit 1
          fi
          echo "all commits signed"

      - name: dependency audit
        run: npm audit --audit-level=high
